# No "ignore:" rules by design. The previous set pinned Dependabot to the
# pre-modernization toolchain (nock > 10.0.6, winston > 2.4.0, eslint 7.x,
# typescript 4.1, @types/chai, eslint-config-prettier 8.x, sphinx 3.5.x) and
# silently suppressed real updates long after every one of those was obsolete.
# Prefer letting a bad update fail in CI over hiding it here; if a rule is ever
# needed, state the reason inline and the condition for removing it.
version: 2
updates:
- package-ecosystem: npm
  directory: "/"
  schedule:
    interval: daily
    time: "13:00"
  open-pull-requests-limit: 10
  labels:
  - dependencies
  commit-message:
    prefix: fix
    prefix-development: chore
    include: scope
- package-ecosystem: pip
  directory: "/docs"
  schedule:
    interval: weekly
    time: "13:00"
  open-pull-requests-limit: 10
  labels:
  - dependencies
  commit-message:
    prefix: chore
    prefix-development: chore
    include: scope
