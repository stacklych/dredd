# This workflow will do a clean install of node dependencies, build the source code and run smoke tests
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-nodejs-with-github-actions

name: run-smoke-tests

on:
  push:
  # Pull requests from forks get no push event in this repository.
  pull_request:
    branches: [main]

# Least privilege for GITHUB_TOKEN; jobs that need more declare it.
permissions:
  contents: read

jobs:
  # smoke tests verifying the packed tarballs are installable
  test-smoke:
    # Same-repo branches are tested on push; pull_request runs only for forks.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository

    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [ubuntu-latest]
        node-version: [22.x]

    steps:
    - uses: actions/checkout@v4
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
    - run: yarn install --frozen-lockfile
    - run: yarn build
    - run: yarn test:smoke
